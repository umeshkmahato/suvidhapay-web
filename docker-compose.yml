services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suvidhapay
      POSTGRES_USER: suvidhapay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U suvidhapay -d suvidhapay"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      DATABASE_ENGINE: POSTGRES
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: suvidhapay
      PGUSER: suvidhapay
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set an access signing secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a different refresh signing secret}
      CORS_ORIGIN: http://localhost:8080
      SUVIDHAPAY_DEMO_MODE: ${SUVIDHAPAY_DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
