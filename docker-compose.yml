# ============================================================================
# SuvidhaPay Municipal Collection Management System — Docker Compose
# Orchestrates Image 1 (Frontend), Image 2 (Backend), and Image 3 (PostgreSQL)
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Image 3: PostgreSQL Database Engine
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: suvidhapay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suvidhapay}
      POSTGRES_USER: ${POSTGRES_USER:-suvidhapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suvidhapay_secret_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - suvidhapay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suvidhapay} -d ${POSTGRES_DB:-suvidhapay}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      # Optional host access for development / db inspection tools (e.g. pgAdmin, DBeaver)
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - suvidhapay_net

  # --------------------------------------------------------------------------
  # Image 2: Node.js & Express REST Backend with Migration & Repositories
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: suvidhapay-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_ENGINE: POSTGRES
      DATABASE_URL: postgres://${POSTGRES_USER:-suvidhapay}:${POSTGRES_PASSWORD:-suvidhapay_secret_2026}@postgres:5432/${POSTGRES_DB:-suvidhapay}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-suvidhapay}
      POSTGRES_USER: ${POSTGRES_USER:-suvidhapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suvidhapay_secret_2026}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-suvidhapay_prod_access_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-suvidhapay_prod_refresh_secret_2026}
      JWT_ACCESS_EXPIRES_SEC: ${JWT_ACCESS_EXPIRES_SEC:-900}
      JWT_REFRESH_EXPIRES_SEC: ${JWT_REFRESH_EXPIRES_SEC:-604800}
      CORS_ORIGIN: "*"
      ALLOW_ADVANCE_OVERPAYMENT: "false"
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - suvidhapay_net

  # --------------------------------------------------------------------------
  # Image 1: React 19 Frontend SPA served via Nginx Reverse Proxy
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ""
    container_name: suvidhapay-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - suvidhapay_net

# ----------------------------------------------------------------------------
# Persistent Volumes & Networks
# ----------------------------------------------------------------------------
volumes:
  suvidhapay_pgdata:
    name: suvidhapay_pgdata

networks:
  suvidhapay_net:
    name: suvidhapay_net
    driver: bridge
